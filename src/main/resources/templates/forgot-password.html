<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertChain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; padding: 20px;
    }
    .auth-card {
      background: #fff; border-radius: 20px; padding: 40px;
      width: 100%; max-width: 420px; box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .auth-card .brand { text-align: center; margin-bottom: 28px; }
    .auth-card .brand h2 { font-weight: 700; color: #0f172a; font-size: 24px; margin: 0; }
    .auth-card .brand p { color: #64748b; font-size: 14px; margin: 4px 0 0; }
    .form-label { font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 4px; }
    .form-control {
      border-radius: 10px; border: 1.5px solid #e2e8f0; font-size: 14px; padding: 11px 14px;
    }
    .form-control:focus { border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.12); }
    .btn-primary {
      background: linear-gradient(135deg, #4f46e5, #7c3aed); border: none;
      border-radius: 10px; padding: 11px 24px; font-weight: 600; width: 100%;
    }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(79,70,229,0.35); }
    .alert { border-radius: 10px; font-size: 13px; padding: 10px 14px; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand">
      <div style="font-size:40px;margin-bottom:8px;">🔐</div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>

    <div th:if="${message}" class="alert alert-danger" th:text="${message}">Error</div>
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}">Success</div>

    <form action="/forgot-password" method="POST">
      <div class="mb-3">
        <label class="form-label">Email Address</label>
        <input type="email" name="email" class="form-control" placeholder="you@example.com" required>
      </div>
      <button type="submit" class="btn btn-primary mb-3">
        <i class="bi bi-send me-1"></i>Send Reset Link
      </button>
    </form>

    <div class="text-center">
      <a href="/" class="text-decoration-none" style="color:#64748b;font-size:14px;">
        <i class="bi bi-arrow-left me-1"></i>Back to Login
      </a>
    </div>
  </div>
</body>
</html>
