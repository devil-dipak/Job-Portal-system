<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertChain HR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:40px; }
  .timeline { position:relative; padding-left:36px; }
  .timeline::before { content:''; position:absolute; left:12px; top:8px; bottom:8px; width:2px; background:#e2e8f0; }
  .timeline-item { position:relative; padding:0 0 24px 20px; }
  .timeline-item:last-child { padding-bottom:0; }
  .timeline-dot { position:absolute; left:-30px; top:4px; width:20px; height:20px; border-radius:50%; border:3px solid #4f46e5; background:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; color:#4f46e5; }
  .timeline-content { background:#fff; border-radius:12px; padding:14px 18px; border:1px solid #e2e8f0; }
  .timeline-content h6 { font-size:14px; font-weight:600; color:#0f172a; margin:0 0 2px; }
  .timeline-content p { font-size:13px; color:#64748b; margin:0; }
  .timeline-content small { font-size:11px; color:#94a3b8; }
</style>
</head>
<body>
<div style="max-width:600px;margin:0 auto;">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <h4 style="font-weight:700;color:#0f172a;"><i class="bi bi-clock-history me-2" style="color:#4f46e5;"></i>Application Timeline</h4>
    <button onclick="window.close()" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-x-lg"></i></button>
  </div>
  <div th:if="${#lists.isEmpty(timeline)}" class="text-center py-5" style="color:#94a3b8;">
    <i class="bi bi-clock" style="font-size:40px;display:block;margin-bottom:8px;"></i>
    <p>No timeline entries yet.</p>
  </div>
  <div class="timeline" th:if="${not #lists.isEmpty(timeline)}">
    <div th:each="entry : ${timeline}" class="timeline-item">
      <div class="timeline-dot"><i class="bi bi-circle-fill" style="font-size:8px;"></i></div>
      <div class="timeline-content">
        <h6 th:text="${entry.status}">Status</h6>
        <p th:if="${entry.remark}" th:text="${entry.remark}">Remark</p>
        <small><span th:text="${entry.updatedBy}">By</span> &middot; <span th:text="${entry.createdAt}">Date</span></small>
      </div>
    </div>
  </div>
</div>
</body>
</html>
