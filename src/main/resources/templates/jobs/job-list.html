<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertChain Student</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #f1f5f9; font-family: 'Segoe UI', system-ui, sans-serif; padding: 30px; }
    .job-card { background: #fff; border-radius: 14px; padding: 20px 24px; border: 1px solid #e2e8f0; transition: all 0.2s; cursor: pointer; text-decoration: none; display: block; }
    .job-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.08); transform: translateY(-2px); }
    .job-card h5 { font-weight: 600; color: #0f172a; margin: 0 0 4px; }
    .job-card .company { font-size: 14px; color: #4f46e5; font-weight: 500; }
    .job-card .meta { font-size: 13px; color: #64748b; margin-top: 8px; }
    .job-card .meta i { margin-right: 4px; }
    .badge-type { font-size: 11px; padding: 3px 10px; border-radius: 20px; font-weight: 600; }
    .section-title { font-size: 22px; font-weight: 700; color: #0f172a; margin: 0 0 4px; }
  </style>
</head>
<body>
  <div class="container" style="max-width:1000px;">
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h4 class="section-title"><i class="bi bi-briefcase me-2" style="color:#4f46e5;"></i>Browse Jobs</h4>
        <p style="color:#64748b;font-size:14px;margin:0;">Find your next opportunity</p>
      </div>
      <div>
        <a href="/studentHome" class="btn btn-outline-secondary btn-sm rounded-pill px-3" th:if="${session.activeuser.role == 'student'}"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a href="/hrHome" class="btn btn-outline-secondary btn-sm rounded-pill px-3" th:if="${session.activeuser.role == 'HR'}"><i class="bi bi-grid me-1"></i>Dashboard</a>
        <a href="/home" class="btn btn-outline-secondary btn-sm rounded-pill px-3" th:if="${session.activeuser.role == 'admin'}"><i class="bi bi-grid me-1"></i>Dashboard</a>
      </div>
    </div>

    <form action="/jobs" method="GET" class="mb-4">
      <div class="input-group">
        <input type="text" name="keyword" class="form-control" placeholder="Search by title, company, location, skills..." th:value="${keyword}" style="border-radius:10px 0 0 10px;border:1.5px solid #e2e8f0;padding:10px 16px;">
        <button type="submit" class="btn btn-primary" style="border-radius:0 10px 10px 0;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;padding:0 24px;"><i class="bi bi-search me-1"></i>Search</button>
      </div>
    </form>

    <div th:if="${#lists.isEmpty(jobs)}" class="text-center py-5" style="color:#94a3b8;">
      <i class="bi bi-inbox" style="font-size:48px;display:block;margin-bottom:12px;"></i>
      <p style="font-size:16px;">No jobs found. Try a different search.</p>
    </div>

    <div class="row g-3" th:if="${not #lists.isEmpty(jobs)}">
      <div class="col-12" th:each="job : ${jobs}">
        <a th:href="'/jobs/' + ${job.id}" class="job-card">
          <div class="d-flex justify-content-between align-items-start">
            <div>
              <h5 th:text="${job.title}">Job Title</h5>
              <div class="company"><i class="bi bi-building"></i> <span th:text="${job.companyName}">Company</span></div>
            </div>
            <div>
              <span class="badge-type" th:if="${job.type == 'full-time'}" style="background:#eef2ff;color:#4f46e5;" th:text="${job.type}">full-time</span>
              <span class="badge-type" th:if="${job.type == 'part-time'}" style="background:#f0fdf4;color:#15803d;" th:text="${job.type}">part-time</span>
              <span class="badge-type" th:if="${job.type == 'internship'}" style="background:#fef2f2;color:#dc2626;" th:text="${job.type}">internship</span>
              <span class="badge-type" th:if="${job.type == 'contract'}" style="background:#f5f3ff;color:#7c3aed;" th:text="${job.type}">contract</span>
            </div>
          </div>
          <div class="meta">
            <span th:if="${job.location}"><i class="bi bi-geo-alt"></i><span th:text="${job.location}">Location</span> &middot; </span>
            <span th:if="${job.salary}"><i class="bi bi-cash"></i><span th:text="${job.salary}">Salary</span> &middot; </span>
            <span><i class="bi bi-calendar"></i> Posted <span th:text="${job.createdAt}">date</span></span>
          </div>
          <div class="mt-2" style="font-size:13px;color:#64748b;" th:if="${job.description != null and job.description.length() > 200}">
            <span th:text="${#strings.substring(job.description, 0, 200) + '...'}">Description preview</span>
          </div>
          <div class="mt-2" style="font-size:13px;color:#64748b;" th:if="${job.description != null and job.description.length() <= 200}">
            <span th:text="${job.description}">Description</span>
          </div>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
