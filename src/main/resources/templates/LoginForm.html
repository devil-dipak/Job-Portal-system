<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CertChain</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
      padding: 20px;
    }

    .auth-container {
      display: flex;
      width: 100%;
      max-width: 900px;
      min-height: 520px;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
      overflow: hidden;
    }

    .auth-brand {
      flex: 1;
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: #fff;
      position: relative;
      overflow: hidden;
    }

    .auth-brand::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 30% 70%, rgba(255,255,255,0.08) 0%, transparent 60%);
    }

    .brand-icon {
      width: 72px;
      height: 72px;
      background: rgba(255,255,255,0.15);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 20px;
      backdrop-filter: blur(4px);
      position: relative;
    }

    .auth-brand h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      position: relative;
    }

    .auth-brand p {
      margin-top: 10px;
      font-size: 14px;
      opacity: 0.8;
      text-align: center;
      line-height: 1.6;
      position: relative;
    }

    .auth-form {
      flex: 1;
      padding: 48px 44px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .auth-form h2 {
      font-size: 24px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 4px;
    }

    .auth-form .subtitle {
      font-size: 14px;
      color: #64748b;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border: 1.5px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      color: #0f172a;
      background: #f8fafc;
      transition: all 0.2s;
      outline: none;
    }

    .form-group input:focus {
      border-color: #4f46e5;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
    }

    .form-group input::placeholder { color: #94a3b8; }

    .error-msg {
      background: #fef2f2;
      color: #dc2626;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 18px;
      border: 1px solid #fecaca;
    }

    .btn-submit {
      width: 100%;
      height: 48px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s;
      margin-top: 4px;
    }

    .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(79, 70, 229, 0.35); }
    .btn-submit:active { transform: translateY(0); }

    .auth-footer {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
      color: #64748b;
    }

    .auth-footer a {
      color: #4f46e5;
      font-weight: 600;
      text-decoration: none;
    }

    .auth-footer a:hover { text-decoration: underline; }

    .forgot-link {
      display: block;
      text-align: right;
      font-size: 13px;
      margin-top: -12px;
      margin-bottom: 18px;
    }
    .forgot-link a {
      color: #64748b;
      text-decoration: none;
    }
    .forgot-link a:hover { color: #4f46e5; text-decoration: underline; }

    @media (max-width: 700px) {
      .auth-container { flex-direction: column; max-width: 420px; }
      .auth-brand { padding: 32px 24px; min-height: 180px; }
      .auth-brand h1 { font-size: 22px; }
      .auth-form { padding: 32px 24px; }
    }
  </style>
</head>
<body>

<div id="toast" th:if="${signupSuccess}" style="position:fixed;top:20px;right:20px;z-index:9999;background:#15803d;color:#fff;padding:12px 22px;border-radius:10px;font-size:14px;font-weight:500;box-shadow:0 8px 30px rgba(0,0,0,0.15);">
  <span th:text="${signupSuccess}">Account created!</span>
</div>

  <div class="auth-container">
    <div class="auth-brand">
      <div class="brand-icon"><img src="/logo.svg" style="width:40px;height:40px;"></div>
      <h1>CertChain</h1>
      <p>Blockchain-powered<br>certificate verification system</p>
    </div>
    <div class="auth-form">
      <h2>Welcome back</h2>
      <p class="subtitle">Sign in to your account</p>

      <p class="error-msg" th:if="${message}" th:text="${message}"></p>

      <form action="/login" method="POST">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" name="password" id="password" placeholder="Enter your password" required>
        </div>
        <div class="forgot-link">
          <a href="/forgot-password">Forgot password?</a>
        </div>
        <button type="submit" class="btn-submit">Sign In</button>
      </form>

      <div class="auth-footer">
        Don&apos;t have an account? <a href="/signup">Create one</a>
      </div>
    </div>
  </div>
<script>
  var t = document.getElementById("toast");
  if (t) {
    setTimeout(function() {
      t.style.transition = "opacity 0.5s"; t.style.opacity = "0";
      setTimeout(function(){t.remove()},500);
    }, 3000);
  }
</script>
</body>
</html>
