<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertChain Student</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:30px; }
  .card-custom { background:#fff; border-radius:14px; padding:24px; border:1px solid #e2e8f0; }
  .interview-item { padding:16px 0; border-bottom:1px solid #f1f5f9; }
  .interview-item:last-child { border-bottom:none; }
</style>
</head>
<body>
<div class="container" style="max-width:800px;">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 style="font-weight:700;color:#0f172a;"><i class="bi bi-calendar-event me-2" style="color:#059669;"></i>My Interviews</h4>
      <p style="color:#64748b;font-size:14px;margin:0;">Upcoming and past interviews</p>
    </div>
    <a href="/studentHome" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-grid me-1"></i>Dashboard</a>
  </div>
  <div class="card-custom">
    <div th:if="${#lists.isEmpty(interviews)}" class="text-center py-4" style="color:#94a3b8;">
      <i class="bi bi-calendar" style="font-size:40px;display:block;margin-bottom:8px;"></i>
      <p style="font-size:15px;">No interviews scheduled yet.</p>
    </div>
    <div th:each="inv : ${interviews}" class="interview-item">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <strong style="font-size:15px;color:#0f172a;" th:text="${inv.jobTitle}">Job Title</strong>
          <div style="font-size:13px;color:#64748b;"><i class="bi bi-building"></i> <span th:text="${inv.companyName}">Company</span></div>
          <div style="font-size:13px;color:#059669;margin-top:4px;"><i class="bi bi-clock"></i> <span th:text="${inv.scheduledAt}">Date/Time</span></div>
          <div th:if="${inv.meetingLink}" style="font-size:13px;margin-top:4px;"><i class="bi bi-camera-video"></i> <a th:href="${inv.meetingLink}" target="_blank" th:text="${inv.meetingLink}">Link</a></div>
        </div>
        <span class="badge" th:classappend="${inv.status == 'scheduled'} ? 'bg-warning text-dark' : 'bg-success'" th:text="${inv.status}" style="font-size:11px;padding:4px 12px;">scheduled</span>
      </div>
    </div>
  </div>
</div>
</body>
</html>
