<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertChain Admin</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:30px; }
  .stat-card { background:#fff; border-radius:14px; padding:20px 24px; border:1px solid #e2e8f0; text-align:center; }
  .stat-number { font-size:28px; font-weight:700; color:#0f172a; }
  .stat-label { font-size:13px; color:#64748b; }
  .table-card { background:#fff; border-radius:14px; padding:24px; border:1px solid #e2e8f0; }
</style>
</head>
<body>
<div class="container" style="max-width:1200px;">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 style="font-weight:700;color:#0f172a;"><i class="bi bi-bar-chart-fill me-2" style="color:#4f46e5;"></i>Admin Reports</h4>
      <p style="color:#64748b;font-size:14px;margin:0;">System-wide analytics and statistics</p>
    </div>
    <a href="/home" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-grid me-1"></i>Dashboard</a>
  </div>

  <div class="row g-3 mb-4">
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" th:text="${totalUsers}">0</div><div class="stat-label">Users</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" th:text="${totalCompanies}">0</div><div class="stat-label">Companies</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" th:text="${totalJobs}">0</div><div class="stat-label">Jobs</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" th:text="${totalApplications}">0</div><div class="stat-label">Applications</div></div></div>
    <div class="col-md-3 col-6"><div class="stat-card"><div class="stat-number" th:text="${totalCertificates}">0</div><div class="stat-label">Certificates</div></div></div>
  </div>

  <div class="row g-3">
    <div class="col-md-6"><div class="table-card"><h6 style="font-weight:600;margin-bottom:12px;"><i class="bi bi-briefcase me-1"></i>All Jobs</h6>
      <table class="table table-sm"><thead><tr><th>Title</th><th>Status</th><th>Created</th></tr></thead>
      <tbody><tr th:each="j : ${jobs}"><td th:text="${j.title}">Title</td><td><span class="badge" th:classappend="${j.status == 'open'} ? 'bg-success' : 'bg-secondary'" th:text="${j.status}">open</span></td><td th:text="${j.createdAt}">date</td></tr></tbody></table></div></div>
    <div class="col-md-6"><div class="table-card"><h6 style="font-weight:600;margin-bottom:12px;"><i class="bi bi-send me-1"></i>All Applications</h6>
      <table class="table table-sm"><thead><tr><th>Job</th><th>Status</th><th>Date</th></tr></thead>
      <tbody><tr th:each="a : ${applications}"><td th:text="${a.jobTitle}">job</td><td th:text="${a.status}">pending</td><td th:text="${a.appliedAt}">date</td></tr></tbody></table></div></div>
    <div class="col-12"><div class="table-card"><h6 style="font-weight:600;margin-bottom:12px;"><i class="bi bi-file-earmark-text me-1"></i>Recent Certificates</h6>
      <table class="table table-sm"><thead><tr><th>Student</th><th>Course</th><th>Issued</th><th>Hash</th></tr></thead>
      <tbody><tr th:each="c : ${certificates}"><td th:text="${c.studentName}">name</td><td th:text="${c.courseName}">course</td><td th:text="${c.issueDate}">date</td><td style="font-size:11px;font-family:monospace;" th:text="${#strings.abbreviate(c.certificateHash, 20)}">hash</td></tr></tbody></table></div></div>
  </div>
</div>
</body>
</html>
