<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertChain Student</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:30px; }
  .job-card { background:#fff; border-radius:14px; padding:20px 24px; border:1px solid #e2e8f0; transition:all 0.2s; text-decoration:none; display:block; }
  .job-card:hover { box-shadow:0 4px 20px rgba(0,0,0,0.08); transform:translateY(-2px); }
  .job-card h5 { font-weight:600; color:#0f172a; margin:0 0 4px; }
  .job-card .company { font-size:14px; color:#4f46e5; font-weight:500; }
  .job-card .meta { font-size:13px; color:#64748b; margin-top:8px; }
  .badge-type { font-size:11px; padding:3px 10px; border-radius:20px; font-weight:600; }
</style>
</head>
<body>
<div class="container" style="max-width:900px;">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 style="font-weight:700;color:#0f172a;"><i class="bi bi-bookmark-heart me-2" style="color:#dc2626;"></i>Saved Jobs</h4>
      <p style="color:#64748b;font-size:14px;margin:0;">Jobs you've bookmarked for later</p>
    </div>
    <a href="/studentHome" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-grid me-1"></i>Dashboard</a>
  </div>
  <div th:if="${#lists.isEmpty(jobs)}" class="text-center py-5" style="color:#94a3b8;">
    <i class="bi bi-bookmark" style="font-size:48px;display:block;margin-bottom:12px;"></i>
    <p style="font-size:16px;">No saved jobs yet. Browse jobs and click the bookmark icon to save them.</p>
    <a href="/jobs" class="btn btn-primary rounded-pill px-4" style="background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;">Browse Jobs</a>
  </div>
  <div class="row g-3" th:if="${not #lists.isEmpty(jobs)}">
    <div class="col-12" th:each="job : ${jobs}">
      <a th:href="'/jobs/' + ${job.id}" class="job-card">
        <div class="d-flex justify-content-between align-items-start">
          <div>
            <h5 th:text="${job.title}">Title</h5>
            <div class="company"><i class="bi bi-building"></i> <span th:text="${job.companyName}">Company</span></div>
          </div>
          <span class="badge-type" th:if="${job.type == 'full-time'}" style="background:#eef2ff;color:#4f46e5;" th:text="${job.type}">full-time</span>
          <span class="badge-type" th:if="${job.type == 'part-time'}" style="background:#f0fdf4;color:#15803d;" th:text="${job.type}">part-time</span>
          <span class="badge-type" th:if="${job.type == 'internship'}" style="background:#fef2f2;color:#dc2626;" th:text="${job.type}">internship</span>
          <span class="badge-type" th:if="${job.type == 'contract'}" style="background:#f5f3ff;color:#7c3aed;" th:text="${job.type}">contract</span>
        </div>
        <div class="meta"><span th:if="${job.location}"><i class="bi bi-geo-alt"></i> <span th:text="${job.location}">Location</span></span></div>
      </a>
    </div>
  </div>
</div>
</body>
</html>
