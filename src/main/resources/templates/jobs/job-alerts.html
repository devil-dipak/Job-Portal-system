<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertChain Student</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:30px; }
  .card-custom { background:#fff; border-radius:14px; padding:24px; border:1px solid #e2e8f0; }
  .alert-item { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #f1f5f9; }
  .alert-item:last-child { border-bottom:none; }
</style>
</head>
<body>
<div class="container" style="max-width:700px;">
  <div class="d-flex align-items-center justify-content-between mb-4">
    <div>
      <h4 style="font-weight:700;color:#0f172a;"><i class="bi bi-bell me-2" style="color:#d97706;"></i>Job Alerts</h4>
      <p style="color:#64748b;font-size:14px;margin:0;">Get notified when matching jobs are posted</p>
    </div>
    <a href="/studentHome" class="btn btn-outline-secondary btn-sm rounded-pill px-3"><i class="bi bi-grid me-1"></i>Dashboard</a>
  </div>

  <div class="card-custom mb-4">
    <h6 style="font-weight:600;margin-bottom:16px;">Create New Alert</h6>
    <form action="/job-alerts/create" method="POST">
      <div class="row g-2">
        <div class="col-md-4"><input type="text" name="keyword" class="form-control" placeholder="Keyword (e.g. Java)" style="border-radius:10px;"></div>
        <div class="col-md-3"><input type="text" name="location" class="form-control" placeholder="Location" style="border-radius:10px;"></div>
        <div class="col-md-3">
          <select name="jobType" class="form-select" style="border-radius:10px;">
            <option value="">Any Type</option>
            <option value="full-time">Full Time</option>
            <option value="part-time">Part Time</option>
            <option value="internship">Internship</option>
            <option value="contract">Contract</option>
          </select>
        </div>
        <div class="col-md-2"><button type="submit" class="btn btn-primary w-100" style="border-radius:10px;background:linear-gradient(135deg,#4f46e5,#7c3aed);border:none;"><i class="bi bi-plus-lg"></i></button></div>
      </div>
    </form>
  </div>

  <div class="card-custom">
    <h6 style="font-weight:600;margin-bottom:4px;">Your Alerts</h6>
    <p style="font-size:13px;color:#64748b;margin-bottom:16px;">Manage your job alert subscriptions</p>
    <div th:if="${#lists.isEmpty(alerts)}" class="text-center py-4" style="color:#94a3b8;">
      <i class="bi bi-bell-slash" style="font-size:32px;display:block;margin-bottom:8px;"></i>
      <p style="font-size:14px;">No alerts created yet.</p>
    </div>
    <div th:each="a : ${alerts}" class="alert-item">
      <div>
        <strong style="font-size:14px;color:#0f172a;" th:text="${a.keyword ?: 'Any'}">Keyword</strong>
        <div style="font-size:12px;color:#64748b;">
          <span th:if="${a.location}"><i class="bi bi-geo-alt"></i> <span th:text="${a.location}">Location</span></span>
          <span th:if="${a.jobType}"> &middot; <span th:text="${a.jobType}">Type</span></span>
        </div>
      </div>
      <div class="d-flex gap-2">
        <span class="badge" th:classappend="${a.active} ? 'bg-success' : 'bg-secondary'" th:text="${a.active} ? 'Active' : 'Paused'" style="font-size:11px;"></span>
        <a th:href="'/job-alerts/toggle?id=' + ${a.id}" class="btn btn-sm btn-outline-secondary rounded-pill" style="font-size:12px;"><i class="bi" th:classappend="${a.active} ? 'bi-pause' : 'bi-play'"></i></a>
        <a th:href="'/job-alerts/delete?id=' + ${a.id}" class="btn btn-sm btn-outline-danger rounded-pill" style="font-size:12px;" onclick="return confirm('Delete this alert?')"><i class="bi bi-trash"></i></a>
      </div>
    </div>
  </div>
</div>
</body>
</html>
