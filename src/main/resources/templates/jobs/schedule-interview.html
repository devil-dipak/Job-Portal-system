<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CertChain HR</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#f1f5f9; font-family:'Segoe UI',system-ui,sans-serif; padding:40px; display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .card { background:#fff; border-radius:16px; padding:36px; border:1px solid #e2e8f0; max-width:560px; width:100%; box-shadow:0 4px 20px rgba(0,0,0,0.06); }
  .detail-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f1f5f9; font-size:14px; }
  .detail-row:last-child { border-bottom:none; }
  .detail-label { color:#64748b; }
  .detail-value { color:#0f172a; font-weight:500; }
</style>
</head>
<body>
<div class="card">
  <div style="text-align:center;margin-bottom:24px;">
    <div style="width:56px;height:56px;border-radius:14px;background:#f5f3ff;color:#7c3aed;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 12px;"><i class="bi bi-calendar-plus"></i></div>
    <h4 style="font-weight:700;color:#0f172a;">Schedule Interview</h4>
    <p style="color:#64748b;font-size:14px;">Set up an interview with the candidate</p>
  </div>

  <div class="detail-row"><span class="detail-label">Candidate</span><span class="detail-value" th:text="${student != null ? student.fname + ' ' + student.lname : 'N/A'}">Name</span></div>
  <div class="detail-row"><span class="detail-label">Job</span><span class="detail-value" th:text="${job != null ? job.title : 'N/A'}">Job Title</span></div>
  <hr style="margin:16px 0;">
  <form action="/job/schedule-interview" method="POST">
    <input type="hidden" name="applicationId" th:value="${application.id}">
    <div class="mb-3">
      <label class="form-label" style="font-weight:600;font-size:13px;color:#334155;">Date & Time</label>
      <input type="datetime-local" name="scheduledAt" class="form-control" required style="border-radius:10px;border:1.5px solid #e2e8f0;padding:10px 14px;">
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-weight:600;font-size:13px;color:#334155;">Meeting Link (optional)</label>
      <input type="url" name="meetingLink" class="form-control" placeholder="https://meet.google.com/..." style="border-radius:10px;border:1.5px solid #e2e8f0;padding:10px 14px;">
    </div>
    <div class="mb-3">
      <label class="form-label" style="font-weight:600;font-size:13px;color:#334155;">Notes (optional)</label>
      <textarea name="notes" class="form-control" rows="3" placeholder="Any instructions for the candidate..." style="border-radius:10px;border:1.5px solid #e2e8f0;padding:10px 14px;"></textarea>
    </div>
    <button type="submit" class="btn btn-primary w-100" style="border-radius:10px;background:linear-gradient(135deg,#7c3aed,#4f46e5);border:none;padding:12px;font-weight:600;">
      <i class="bi bi-send me-1"></i>Schedule Interview
    </button>
  </form>
</div>
</body>
</html>
